context:
  version: "2026.10.0"

# Note: This recipe is specifically designed to work well with the autotick bot.
# Also refer to https://github.com/conda-forge/rust-feedstock/blob/main/recipe/meta.yaml.
package:
  name: sasktran2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sasktran2/sasktran2-${{ version }}.tar.gz
  sha256: f70d228ee66f6988294616fb3b5b653181312f68b098c5f5799d78ca24151249

build:
  number: 0
  skip:
    - not (match(python, python_min ~ ".*") and is_abi3)
  python:
    version_independent: true


requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin >=1.3.2,<2
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cmake
    - cargo-bundle-licenses
    - if: unix
      then:
        - make
    - if: osx
      then:
        - llvm-openmp
    - if: linux
      then:
        - libgomp
    - if: build_platform == 'win-64'
      then:
        - m2-base

  host:
    - python
    - python-abi3
    - pip
    - maturin >=1.3.2,<2
    - eigen <5
    - libblas
    - libcblas
    - liblapack
    - liblapacke
    - libtmglib
    - zlib
    - spdlog
  run:
    - python
    - numpy
    - appdirs
    - pyyaml
    - xarray
    - netcdf4
    - scipy

tests:
  - python:
      pip_check: true
      imports:
        - sasktran2
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "from sasktran2 import *"

about:
  summary: The SASKTRAN radiative transfer model Version 2
  license: MIT
  license_file:
    - license.md
    - THIRDPARTY.yml
  documentation: https://sasktran2.readthedocs.io/
  homepage: https://github.com/usask-arg/sasktran2

extra:
  recipe-maintainers:
    - dannyzed
